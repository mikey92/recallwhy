<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RecallWhy review</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:#d2d2d7;--warn:#b42318;--ok:#1f7a3a;--focus:#0071e3;--primary:#0066cc}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mute:#a1a1a6;--line:#38383a;--warn:#ff8a80;--ok:#30d158;--focus:#0a84ff;--primary:#0060c7}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
header{position:sticky;top:0;z-index:1;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:baseline;gap:16px}
h1{font-size:22px;margin:0;font-weight:700}
header p{margin:0;color:var(--mute);font-size:15px}
header a{margin-left:auto;color:var(--focus);font-size:15px;padding:11px 0}
main{max-width:880px;margin:0 auto;padding:24px}
.sec{font-size:20px;margin:8px 0 4px}
.files a{color:var(--focus);font-size:15px;margin-right:14px;display:inline-block;padding:10px 0}
.empty{color:var(--mute);text-align:center;padding:60px 0}
.case{background:var(--card);border-radius:14px;padding:20px 22px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.case h2{font-size:19px;margin:0 0 2px}
.meta{color:var(--mute);font-size:15px;margin:0 0 12px}
.notice{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--mute);font-size:15px;margin:0 0 14px}
.sku{border-top:1px solid var(--line);padding:14px 0 4px}
.sku h3{font-size:17px;margin:0 0 4px}
.sku h3 span{color:var(--mute);font-weight:400;font-size:15px}
.why{font-size:15px;margin:0 0 6px}
.obj{font-size:15px;color:var(--warn);margin:0 0 10px}
.facts{font-size:15px;color:var(--mute);margin:0 0 8px}.facts b{color:var(--ink);font-weight:600}
.case h2 a{color:inherit;text-decoration:none}.report{font-size:15px;color:var(--focus)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sr{position:absolute;left:-9999px}
input[type=text]{flex:1 1 260px;min-height:44px;font:inherit;font-size:15px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit}
button{min-height:44px;min-width:44px;padding:0 18px;border-radius:10px;border:0;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
button.same{background:var(--primary);color:#fff}
button.link{background:transparent;color:var(--focus);padding:0 8px;font-weight:500}
button.not{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.done{font-size:15px;color:var(--ok);margin:6px 0 0}
/* Motion: cases rise in one after another on first load; a new decision fades in. Ease-out; off with reduced motion (rule above). */
@keyframes rise{from{opacity:0;transform:translateY(12px)}}@keyframes fade{from{opacity:0}}
.intro .case{animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(min(var(--i,0),8) * 70ms)}
.done.new{animation:fade .4s ease-out both}
</style>
</head>
<body>
<header><h1>Review queue</h1><p id="sum" role="status" aria-live="polite"></p><a href="/">Live view</a></header>
<main><h2 class="sec">Action packets</h2><p class="meta">Drafts from the latest run: what to pull, what to ask the supplier, what to tell customers. Approving records who and when; nothing is sent.</p><div id="packets"></div><h2 class="sec">Matches to decide</h2><div id="list" class="intro"></div></main>
<script>
// On the public site (scripts/build-site.mjs) RW_STATIC holds a recorded queue and recorded packets:
// decisions and approvals are kept in this browser only, nothing is recorded or sent.
const S = window.RW_STATIC;
const outDir = (run) => S ? (S.runs[run] ?? "#") : `/out/${run}`;
const local = (k) => { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch { return []; } };
const keep = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
async function api(path, body) {
  if (!S) { const r = body ? await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }) : await fetch(path); return r; }
  const ok = (data) => ({ ok: true, json: async () => data, text: async () => "" });
  if (path === "/api/queue") return ok({ queue: S.queue, decided: local("rw-demo-decided") });
  if (path === "/api/packets") { const a = Object.fromEntries(local("rw-demo-approved").map((x) => [x.caseId, x])); return ok({ runId: S.packets.runId, packets: S.packets.packets.map((p) => a[p.caseId] ? { ...p, approval: a[p.caseId] } : p) }); }
  if (path === "/api/decide") { keep("rw-demo-decided", [...local("rw-demo-decided").filter((d) => !(d.recall === body.recall && d.sku === body.sku)), { ...body, memoryId: "kept in this browser only" }]); return ok({}); }
  if (path === "/api/approve") { keep("rw-demo-approved", [...local("rw-demo-approved").filter((x) => x.caseId !== body.caseId), { caseId: body.caseId, by: body.by || "you", at: new Date().toISOString(), note: "" }]); return ok({}); }
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const label = { "same": "Same product", "not-this": "Not this product", "unsure": "Undecided" };
let n = 0;

function skuBlock(c, s, done) {
  const d = done.get(c.recall + " " + s.sku);
  const objections = c.open.filter((o) => (c.skus.length === 1 || o.includes(s.sku) || o.includes(`"${s.title}"`)) && !o.includes(s.why));
  const id = "n" + (n++);
  return `<div class="sku"><h3>${esc(s.title)} <span>${esc(s.sku)}</span></h3>
    <p class="why">Agents: <b>${label[s.verdict] ?? esc(s.verdict)}</b> — ${esc(s.why)}</p>
    ${objections.map((o) => `<p class="obj">${esc(o)}</p>`).join("")}
    <p class="facts">Our UPC <b>${esc(s.upc || "none")}</b> · vendor <b>${esc(s.vendor || "unknown")}</b></p>
    ${d ? `<p class="done">Decided: ${label[d.verdict]} (${esc(d.memoryId)}). The next run follows it.
             <span class="row" style="display:inline-flex" data-recall="${esc(c.recall)}" data-sku="${esc(s.sku)}"><input type="hidden" value="changed by reviewer">
             <button class="link" data-verdict="${d.verdict === "same" ? "not-this" : "same"}" aria-label="Change decision for ${esc(s.sku)} to ${label[d.verdict === "same" ? "not-this" : "same"]}">Change to “${label[d.verdict === "same" ? "not-this" : "same"]}”</button></span></p>`
        : `<div class="row" data-recall="${esc(c.recall)}" data-sku="${esc(s.sku)}">
             <label class="sr" for="${id}">Note for ${esc(s.sku)}</label>
             <input type="text" id="${id}" placeholder="Note for the record (optional)">
             <button class="same" data-verdict="same" aria-label="Same product: ${esc(s.sku)}">Same product</button>
             <button class="not" data-verdict="not-this" aria-label="Not this product: ${esc(s.sku)}">Not this product</button></div>`}
    <p class="obj" hidden></p></div>`;
}

async function load() {
  const { queue, decided } = await (await api("/api/queue")).json();
  const done = new Map(decided.map((d) => [d.recall + " " + d.sku, d]));
  const waiting = queue.flatMap((c) => c.skus.filter((s) => !done.has(c.recall + " " + s.sku))).length;
  n = 0;
  document.getElementById("list").innerHTML = queue.length
    ? queue.slice().reverse().map((c, i) => `<section class="case" style="--i:${i}"><h2>${esc(c.firm || c.recall)}</h2>
        <p class="meta">${esc(c.recall)}${c.date ? " · recalled " + esc(c.date) : ""}${c.runId ? ` · <a class="report" href="${esc(outDir(c.runId))}/report.html" target="_blank">Report and agent trace</a>` : ""}</p>
        ${c.notice ? `<p class="notice">${esc(c.notice)}</p>` : ""}
        ${c.skus.map((s) => skuBlock(c, s, done)).join("")}</section>`).join("")
    : `<p class="empty">Nothing to review. Cases the agents cannot settle appear here.</p>`;
  document.getElementById("sum").textContent = waiting ? `${waiting} decision${waiting > 1 ? "s" : ""} waiting` : "All decided";
}

document.getElementById("list").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-verdict]");
  if (!b) return;
  const row = b.closest(".row");
  const what = label[b.dataset.verdict];
  // A decision is stored with high trust and every later run follows it: confirm before recording.
  if (!confirm(`Record “${what}” for ${row.dataset.sku}?\n\nIt is stored in memory with high trust and the next run follows it. You can change it until then.`)) return;
  b.disabled = true;
  const r = await api("/api/decide", { recall: row.dataset.recall, sku: row.dataset.sku, verdict: b.dataset.verdict, note: row.querySelector("input").value });
  if (!r.ok) { b.disabled = false; const p = row.closest(".sku").querySelector(".obj[hidden]"); p.textContent = await r.text(); p.hidden = false; return; }
  document.getElementById("list").classList.remove("intro");
  await load();
  document.querySelector(`.row[data-recall="${CSS.escape(row.dataset.recall)}"][data-sku="${CSS.escape(row.dataset.sku)}"]`)?.closest(".done")?.classList.add("new");
  document.getElementById("sum").textContent = `Recorded “${what}” for ${row.dataset.sku}. ` + document.getElementById("sum").textContent;
});
async function loadPackets() {
  const { runId, packets } = await (await api("/api/packets")).json();
  document.getElementById("packets").innerHTML = packets.length ? packets.map((p) => `<section class="case"><h2>${esc(p.firm || p.recall)}</h2><p class="meta">${esc(p.recall)} · ${esc(p.product || "")}</p>
    <p class="meta">${p.status === "draft" ? `Pull <b>${p.pullUnits}</b> unit(s) in <b>${p.stores}</b> store(s) · ${p.shipNotices} supplier ship notice(s) cited${p.customers ? ` · notice for at most ${p.customers} customer(s)` : ""} · totals match the Auditor's numbers` : `Withheld: ${esc(p.reason)}`}</p>
    <p class="files">${p.files.map((f) => `<a href="${esc(outDir(runId))}/actions/${esc(p.caseId)}/${esc(f)}" target="_blank">${esc(f)}</a>`).join("")}</p>
    ${p.approval ? `<p class="done">Approved by ${esc(p.approval.by)} at ${esc(p.approval.at.slice(0, 16).replace("T", " "))}. Not sent.</p>`
      : p.status === "draft" ? `<div class="row" data-run="${esc(runId)}" data-case="${esc(p.caseId)}"><label class="sr" for="by-${esc(p.caseId)}">Your name</label><input type="text" id="by-${esc(p.caseId)}" placeholder="Your name"><button class="same" data-approve="1">Approve packet</button></div>` : ""}
    </section>`).join("") : `<p class="empty">No action packets yet. A run drafts one for every recall with our stock or sales.</p>`;
}
document.getElementById("packets").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-approve]");
  if (!b) return;
  const row = b.closest(".row");
  if (!confirm(`Approve the action packet for ${row.dataset.case}?\n\nThis records your approval. Nothing is sent.`)) return;
  b.disabled = true;
  const r = await api("/api/approve", { run: row.dataset.run, caseId: row.dataset.case, by: row.querySelector("input").value });
  if (!r.ok) { b.disabled = false; alert(await r.text()); return; }
  await loadPackets();
});
if (S) { const b = document.createElement("p"); b.className = "meta"; b.style.cssText = "margin:0 0 16px;padding:10px 14px;border-radius:10px;background:var(--card)";
  b.textContent = S.note; document.querySelector("main").prepend(b); document.querySelector("header a").href = "index.html"; document.querySelector("header a").textContent = "Project page"; }
load();
loadPackets();
</script>
</body>
</html>
