name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Static copy of the committed example runs: their reports and traces, the replay viewer, a landing page.
      - run: |
          mkdir -p _site/examples _site/img
          cp site/*.html _site/
          cp docs/img/report-case.png docs/img/live-agents.gif _site/img/
          for d in examples/output/*/; do n=$(basename "$d"); mkdir -p "_site/examples/$n"; cp "$d"report.html "$d"trace.jsonl "_site/examples/$n/"; for x in digest.md actions briefs; do [ -e "$d$x" ] && cp -R "$d$x" "_site/examples/$n/"; done; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
